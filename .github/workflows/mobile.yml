name: Build mobile downloads
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Build development APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Prepare Android download
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Cash-Out-Android-debug.apk
          sha256sum release-artifacts/Cash-Out-Android-debug.apk > release-artifacts/Android-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-download
          path: release-artifacts/
          if-no-files-found: error
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run native:sync
      - name: Compile iOS simulator app (no Apple account required)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Package developer download
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app release-artifacts/Cash-Out-iOS-simulator.zip
          cp docs/MOBILE.md release-artifacts/READ-ME-iPhone-installation.md
      - uses: actions/upload-artifact@v4
        with:
          name: ios-developer-download
          path: release-artifacts/
          if-no-files-found: error
  publish-android:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-download
          path: release-artifacts
      - name: Publish Android beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-beta-${GITHUB_RUN_NUMBER}" release-artifacts/* --target "$GITHUB_SHA" --prerelease --title "Cash Out Android beta ${GITHUB_RUN_NUMBER}" --notes-file docs/ANDROID_RELEASE_NOTES.md
  publish-ios:
    needs: [ios, publish-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-developer-download
          path: release-artifacts
      - name: Attach simulator developer files (not an iPhone installer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "android-beta-${GITHUB_RUN_NUMBER}" release-artifacts/* --clobber
